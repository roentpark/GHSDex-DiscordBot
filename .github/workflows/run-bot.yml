name: Run GHSdex Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually click "Start"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Initialize Database Maps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m aerich upgrade || true

      - name: Launch Ballsdex Core Engine
        env:
          TOKEN: ${{ secrets.TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python bot.py
