name: Run GHSdex Bot 24/7

on:
  push:
    branches: [ v3 ]
  workflow_dispatch: # Allows you to manually click "Start"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Official Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . python-dotenv

      - name: Initialize Database Maps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: admin_panel.settings
        run: python -m aerich upgrade || true

      - name: Launch Ballsdex Core Engine
        env:
          TOKEN: ${{ secrets.TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: admin_panel.settings
        run: python -m ballsdex.core.bot
